<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Metal</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #6a6a6a, #b0b0b0);
            animation: gradientShift 5s infinite alternate;
        }

        @keyframes gradientShift {
            0% {
                background: linear-gradient(45deg, #6a6a6a, #b0b0b0);
            }
            100% {
                background: linear-gradient(45deg, #b0b0b0, #6a6a6a);
            }
        }

        h1 {
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="gradient-container">
        <h1>Gradient Metal</h1>
    </div>
</body>
</html>
