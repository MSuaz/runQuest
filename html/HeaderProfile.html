<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Profile</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .header-container {
            position: relative;
            height: 300px;
            overflow: hidden;
            background-color: #111;
        }

        .header-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://via.placeholder.com/1500x500');
            background-size: cover;
            background-position: center;
            filter: blur(0px);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .profile-picture {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #fff;
            background-color: #333;
            background-image: url('https://via.placeholder.com/80');
            background-size: cover;
            background-position: center;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .header-title {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            opacity: 1;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .content {
            padding: 20px;
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="header-container" id="headerContainer">
        <div class="header-background" id="headerBackground"></div>
        <div class="profile-picture" id="profilePicture"></div>
        <div class="header-title" id="headerTitle">User Name</div>
    </div>

    <!-- Content Section -->
    <div class="content">
        <p>Scroll down to see the header animation in action.</p>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin vel nisi nec lorem tincidunt tincidunt.</p>
        <p>...</p>
    </div>

    <script>
        const headerContainer = document.getElementById('headerContainer');
        const headerBackground = document.getElementById('headerBackground');
        const profilePicture = document.getElementById('profilePicture');
        const headerTitle = document.getElementById('headerTitle');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const scale = Math.max(1 - scrollY / 300, 0.7);
            const blur = Math.min(scrollY / 50, 8);
            const opacity = Math.max(1 - scrollY / 150, 0);

            // Scale and blur the background
            headerBackground.style.transform = `scale(${scale})`;
            headerBackground.style.filter = `blur(${blur}px)`;

            // Scale and fade the profile picture
            profilePicture.style.transform = `translateX(-50%) scale(${scale})`;
            profilePicture.style.opacity = opacity;

            // Move and fade the title
            headerTitle.style.transform = `translateX(-50%) translateY(${scrollY / 5}px)`;
            headerTitle.style.opacity = opacity;
        });
    </script>
</body>
</html>
