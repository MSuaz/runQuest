<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Sneakers</title>
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.154.0/build/three.module.js';
  import { OrbitControls } from 'https://unpkg.com/three@0.154.0/examples/jsm/controls/OrbitControls.js';

  let scene, camera, renderer, sneaker, controls;

  function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    addLighting();
    createSneaker();
    animate();

    window.addEventListener('resize', onWindowResize);
  }

  function addLighting() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);
  }

  function createSneaker() {
    const sneakerGroup = new THREE.Group();

    const base = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.5, 1),
      new THREE.MeshStandardMaterial({ color: 0xcccccc })
    );
    base.position.y = 0.25;
    sneakerGroup.add(base);

    const upper = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.8, 0.9),
      new THREE.MeshStandardMaterial({ color: 0x888888 })
    );
    upper.position.y = 0.9;
    sneakerGroup.add(upper);

    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.1, 0.9),
      new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    stripe.position.y = 1.1;
    sneakerGroup.add(stripe);

    const sole = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 0.2, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    sole.position.y = 0.1;
    sneakerGroup.add(sole);

    sneaker = sneakerGroup;
    scene.add(sneaker);
  }

  function animate() {
    requestAnimationFrame(animate);
    if (sneaker) sneaker.rotation.y += 0.01;
    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  init();
</script>
</body>
</html>
