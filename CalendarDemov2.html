<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendario – Demo</title>
<style>
  :root {
    --bg: #111109;
    --card: #18180c;
    --border: #ffd600;
    --yellow: #ffd600;
    --yellow-dark: #bfa800;
    --text: #ffd600;
    --text-muted: #fffbe0;
    --radius: 18px;
    --shadow: 0 2px 16px #0004;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 1rem;
    min-height: 100vh;
  }

  /* ────────────────  TOP BAR  ──────────────── */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 0.5rem 0.7rem;
  }

  .top-bar button {
    background: var(--yellow);
    border: none;
    color: #111109;
    font-size: 1.25rem;
    cursor: pointer;
    padding: 0.45rem 0.9rem;
    border-radius: var(--radius);
    font-weight: bold;
    transition: background 0.18s;
    box-shadow: 0 1px 6px #0002;
  }
  .top-bar button:active {
    background: var(--yellow-dark);
  }

  .top-bar select {
    appearance: none;
    background: #111109;
    border: 2px solid var(--yellow);
    color: var(--yellow);
    font-weight: 600;
    font-size: 1rem;
    padding: 0.45rem 2.2rem 0.45rem 0.9rem;
    border-radius: var(--radius);
    position: relative;
    cursor: pointer;
    box-shadow: 0 1px 6px #0002;
    margin-right: 0.1rem;
  }
  .top-bar select:focus {
    outline: none;
    border-color: var(--yellow-dark);
    background: #18180c;
  }

  /* ────────────────  DAYS SCROLLER  ──────────────── */
  .days {
    display: flex;
    overflow-x: auto;
    gap: 0.5rem;
    padding: 0.75rem 0 1rem;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .days::-webkit-scrollbar {
    display: none;
  }

  .day {
    flex: 0 0 auto;
    width: 56px;
    text-align: center;
    padding: 0.55rem 0;
    border-radius: var(--radius);
    cursor: pointer;
    scroll-snap-align: start;
    background: #18180c;
    border: 2px solid transparent;
    color: var(--yellow);
    transition: background 0.2s, border 0.2s;
    box-shadow: 0 1px 6px #0002;
  }
  .day:hover {
    background: #222211;
    border-color: var(--yellow-dark);
  }
  .day.selected {
    background: var(--yellow);
    color: #18180c;
    border-color: var(--yellow-dark);
  }
  .day .dow {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .day.selected .dow {
    color: #18180c;
  }
  .day .date {
    margin-top: 4px;
    font-size: 1.25rem;
    font-weight: 700;
    color: inherit;
  }

  /* ────────────────  DETAILS PANEL  ──────────────── */
  .panel {
    border: 2px solid var(--yellow);
    border-radius: var(--radius);
    background: var(--card);
    padding: 1.2rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.2rem;
  }

  .panel .headline {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1.25rem;
  }
  .panel .headline .bar {
    width: 5px;
    height: 28px;
    background: var(--yellow);
    border-radius: 3px;
  }
  .panel .label {
    font-size: 0.95rem;
    color: var(--text-muted);
  }
  .panel .date-string {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--yellow);
  }

  .panel h2 {
    margin-top: 1rem;
    margin-bottom: 0.75rem;
    font-size: 1.2rem;
    color: var(--yellow);
    letter-spacing: 0.01em;
  }

  .event {
    border: 2px solid var(--yellow);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
    background: #18180c;
    transition: background 0.2s, border 0.2s;
    box-shadow: 0 1px 6px #0002;
  }
  .event:hover {
    background: #222211;
    border-color: var(--yellow-dark);
  }
  .event .time {
    font-weight: 700;
    color: var(--yellow);
    font-size: 1.1rem;
    background: #111109;
    border-radius: 1em;
    padding: 0.15em 0.8em;
    display: inline-block;
    margin-bottom: 0.3em;
    box-shadow: 0 1px 4px #0002;
  }
  .event .title {
    margin-top: 0.25rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--yellow);
  }
  .event .desc {
    font-size: 0.97rem;
    color: var(--text-muted);
    margin-bottom: 0.3em;
  }

  /* Session type badge styles */
  .event-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
    font-size: 0.95em;
    font-weight: 600;
    border-radius: 10px;
    padding: 0.18em 0.7em 0.18em 0.5em;
    margin-right: 0.5em;
    vertical-align: middle;
    letter-spacing: 0.01em;
    background: var(--yellow);
    color: #18180c;
    box-shadow: 0 1px 4px #0002;
  }
  .badge-sunrise {
    background: #ffe900;
    color: #18180c;
  }
  .badge-interval {
    background: #fffbe0;
    color: #bfa800;
  }
  .badge-recovery {
    background: #fffbe0;
    color: #18180c;
  }
  .event .capacity {
    font-size: 0.95em;
    color: var(--yellow);
    margin-top: 0.2em;
    font-weight: 500;
  }

  .event .btn {
    background: var(--yellow);
    color: #18180c;
    border: none;
    border-radius: var(--radius);
    font-weight: bold;
    font-size: 1em;
    padding: 0.4em 1.2em;
    cursor: pointer;
    margin-right: 0.3em;
    box-shadow: 0 1px 6px #0002;
    transition: background 0.18s;
  }
  .event .btn:active {
    background: var(--yellow-dark);
  }
  .event .btn.cancel {
    background: #18180c;
    color: var(--yellow);
    border: 2px solid var(--yellow);
  }
  .event .btn.cancel:active {
    background: #222211;
    color: var(--yellow-dark);
    border-color: var(--yellow-dark);
  }
  .event .btn[disabled] {
    opacity: 0.6;
    cursor: not-allowed;
    background: #bfa800;
    color: #fffbe0;
  }

  @media (max-width: 600px) {
    .panel {
      padding: 0.7rem;
    }
    .event {
      padding: 0.7rem;
    }
    .event .title {
      font-size: 1em;
    }
    .event .desc, .event .capacity {
      font-size: 0.9em;
    }
    .top-bar {
      padding: 0.3rem 0.3rem;
      gap: 0.4rem;
    }
    .top-bar button, .top-bar select {
      font-size: 0.95rem;
      padding: 0.3rem 0.7rem;
    }
    .day {
      width: 44px;
      padding: 0.35rem 0;
    }
  }
  @media (max-width: 350px) {
    .panel {
      padding: 0.3rem;
    }
    .event {
      padding: 0.4rem;
    }
    .top-bar {
      padding: 0.1rem 0.1rem;
      gap: 0.2rem;
    }
    .day {
      width: 32px;
      padding: 0.18rem 0;
    }
    .event .title, .event .desc, .event .capacity {
      font-size: 0.8em;
    }
  }

  .no-events {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .footer-note {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .version {
    text-align: right;
    margin-top: 2rem;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  /* Sidebar for roster */
  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 320px;
    max-width: 90vw;
    height: 100vh;
    background: #18180c;
    border-left: 2px solid var(--yellow);
    box-shadow: -2px 0 16px #0008;
    z-index: 100;
    padding: 1.5rem 1rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transform: translateX(100%);
    transition: transform 0.25s;
    border-radius: 0 0 0 var(--radius);
  }
  .sidebar.open {
    transform: translateX(0);
  }
  .sidebar h3 {
    margin: 0 0 0.5em 0;
    font-size: 1.1em;
    color: var(--yellow);
    letter-spacing: 0.01em;
  }
  .roster-list {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 1em;
  }
  .roster-item {
    background: #111109;
    border-radius: var(--radius);
    padding: 0.7em 1em;
    margin-bottom: 0.5em;
    display: flex;
    flex-direction: column;
    gap: 0.1em;
    font-size: 0.97em;
    border: 2px solid var(--yellow);
    color: var(--yellow);
    box-shadow: 0 1px 6px #0002;
  }
  .roster-item .cancel-btn {
    align-self: flex-end;
    background: #18180c;
    border: 2px solid var(--yellow);
    color: var(--yellow);
    font-size: 0.9em;
    cursor: pointer;
    margin-top: 0.2em;
    border-radius: var(--radius);
    padding: 0.2em 0.9em;
    font-weight: bold;
    transition: background 0.18s;
  }
  .roster-item .cancel-btn:active {
    background: #222211;
    color: var(--yellow-dark);
    border-color: var(--yellow-dark);
  }
  .sidebar .close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: var(--yellow);
    border: none;
    color: #18180c;
    font-size: 1.5em;
    cursor: pointer;
    border-radius: 50%;
    width: 2em;
    height: 2em;
    box-shadow: 0 1px 6px #0002;
    font-weight: bold;
    transition: background 0.18s;
  }
  .sidebar .close-btn:active {
    background: var(--yellow-dark);
  }

  /* Modal styles */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: #000a;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal {
    background: #18180c;
    border-radius: var(--radius);
    padding: 2rem 1.5rem 1.5rem 1.5rem;
    min-width: 320px;
    max-width: 95vw;
    box-shadow: 0 8px 32px #000c;
    color: var(--yellow);
    position: relative;
    border: 2px solid var(--yellow);
  }
  .modal h3 {
    margin-bottom: 1em;
    color: var(--yellow);
    font-size: 1.1em;
  }
  .modal label {
    display: block;
    margin-bottom: 0.3em;
    font-size: 0.97em;
    color: var(--text-muted);
  }
  .modal input {
    width: 100%;
    padding: 0.6em;
    border-radius: var(--radius);
    border: 2px solid var(--yellow);
    background: #111109;
    color: var(--yellow);
    margin-bottom: 1em;
    font-size: 1em;
    box-shadow: 0 1px 6px #0002;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--yellow-dark);
    background: #18180c;
  }
  .modal .modal-actions {
    display: flex;
    gap: 1em;
    justify-content: flex-end;
  }
  .modal .btn {
    padding: 0.5em 1.2em;
    border-radius: var(--radius);
    border: none;
    font-weight: 600;
    font-size: 1em;
    cursor: pointer;
    background: var(--yellow);
    color: #18180c;
    transition: background 0.2s;
    box-shadow: 0 1px 6px #0002;
  }
  .modal .btn.cancel {
    background: #18180c;
    color: var(--yellow);
    border: 2px solid var(--yellow);
  }
  .modal .btn.cancel:active {
    background: #222211;
    color: var(--yellow-dark);
    border-color: var(--yellow-dark);
  }
  .modal .error {
    color: #ff5c5c;
    font-size: 0.95em;
    margin-bottom: 0.5em;
  }
  @media (max-width: 600px) {
    .modal {
      min-width: 90vw;
      padding: 1.2rem 0.7rem 1rem 0.7rem;
    }
  }
  @media (max-width: 350px) {
    .modal {
      min-width: 98vw;
      padding: 0.5rem 0.2rem 0.2rem 0.2rem;
    }
  }

  /* Responsive clock/timer component */
  .clock {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111109;
    color: var(--yellow);
    border-radius: 2em;
    font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    font-weight: bold;
    letter-spacing: 0.04em;
    min-width: 3.5em;
    min-height: 2.2em;
    padding: 0.3em 1.2em;
    font-size: 2.2em;
    box-shadow: 0 2px 12px #0003;
    margin: 0.5em auto;
    border: 2px solid var(--yellow);
    transition: font-size 0.2s, padding 0.2s;
    user-select: none;
  }
  @media (max-width: 350px) {
    .clock {
      font-size: 1.1em;
      padding: 0.15em 0.5em;
      min-width: 1.8em;
      min-height: 1.1em;
      border-width: 1.5px;
    }
  }
  @media (max-width: 500px) {
    .clock {
      font-size: 1.4em;
      padding: 0.18em 0.7em;
      min-width: 2.2em;
      min-height: 1.2em;
    }
  }
  @media (min-width: 501px) and (max-width: 900px) {
    .clock {
      font-size: 1.8em;
      padding: 0.22em 1em;
      min-width: 3em;
      min-height: 1.7em;
    }
  }
  @media (min-width: 901px) {
    .clock {
      font-size: 2.2em;
      padding: 0.3em 1.2em;
      min-width: 3.5em;
      min-height: 2.2em;
    }
  }
</style>
</head>
<body>
  <!-- ────────────────  HEADER  ──────────────── -->
  <div class="top-bar">
    <button id="prevMonth" aria-label="Mes anterior">⟨</button>

    <button id="openPicker" aria-label="Abrir selector de fecha">📅</button>

    <select id="monthSelect"></select>
    <select id="yearSelect"></select>

    <button id="nextMonth" aria-label="Mes siguiente">⟩</button>
  </div>

  <!-- ────────────────  DAYS  ──────────────── -->
  <div class="days" id="daysContainer"></div>

  <!-- ────────────────  PANEL  ──────────────── -->
  <div class="panel">
    <div class="headline">
      <div class="bar"></div>
      <div>
        <div class="label">Fecha seleccionada</div>
        <div class="date-string" id="selectedDateLabel">—</div>
      </div>
    </div>

    <h2>Eventos programados</h2>
    <div id="eventsContainer"></div>

    <p class="footer-note">
      Este es un ejemplo de layout maestro-detalle donde el calendario actúa como el componente maestro que controla el contenido del panel de detalles.
    </p>
  </div>

  <div class="version">v1.0.1</div>

  <!-- Sidebar for roster -->
  <div class="sidebar" id="rosterSidebar">
    <button class="close-btn" id="closeRoster" title="Cerrar">&times;</button>
    <h3 id="rosterTitle">Participantes</h3>
    <div class="roster-list" id="rosterList"></div>
  </div>

  <!-- Modal for sign-up -->
  <div class="modal-bg" id="signupModalBg" style="display:none;">
    <div class="modal" id="signupModal">
      <h3>Reserva tu plaza</h3>
      <form id="signupForm" autocomplete="off">
        <div class="error" id="signupError" style="display:none;"></div>
        <label for="signupName">Nombre completo</label>
        <input type="text" id="signupName" required maxlength="40" />
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required maxlength="40" />
        <label for="signupEmergency">Contacto de emergencia</label>
        <input type="text" id="signupEmergency" required maxlength="20" />
        <div class="modal-actions">
          <button type="button" class="btn cancel" id="cancelSignup">Cancelar</button>
          <button type="submit" class="btn">Reservar</button>
        </div>
      </form>
    </div>
  </div>

<script>
/*────────────────  DATA  ────────────────*/
const monthNames = [
  "enero","febrero","marzo","abril","mayo","junio",
  "julio","agosto","septiembre","octubre","noviembre","diciembre"
];
const weekDayNames = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

// Session type icon and color mapping
const sessionTypeMap = {
  "Sunrise Tempo": {
    badgeClass: "badge-sunrise",
    icon: "🌅"
  },
  "Interval Blast": {
    badgeClass: "badge-interval",
    icon: "⚡"
  },
  "Recovery Jog": {
    badgeClass: "badge-recovery",
    icon: "🦶"
  }
};

// Demo-events map with session types, times, and capacity
const eventsMap = {
  "2025-06-10": [
    {
      type: "Sunrise Tempo",
      time: "06:00",
      title: "Sunrise Tempo",
      desc: "Entrenamiento de ritmo al amanecer para mejorar la resistencia.",
      capacity: 20
    },
    {
      type: "Interval Blast",
      time: "18:00",
      title: "Interval Blast",
      desc: "Sesión de intervalos de alta intensidad.",
      capacity: 15
    },
  ],
  "2025-06-12": [
    {
      type: "Recovery Jog",
      time: "07:30",
      title: "Recovery Jog",
      desc: "Trote suave para recuperación activa.",
      capacity: 25
    }
  ]
};

/*────────────────  ROSTER STORAGE  ────────────────*/
function getRosterKey(dateStr, time) {
  return `roster_${dateStr}_${time}`;
}
function getRoster(dateStr, time) {
  try {
    return JSON.parse(localStorage.getItem(getRosterKey(dateStr, time))) || [];
  } catch {
    return [];
  }
}
function setRoster(dateStr, time, roster) {
  localStorage.setItem(getRosterKey(dateStr, time), JSON.stringify(roster));
}

/*────────────────  HELPERS  ────────────────*/
const qs = (s, el = document) => el.querySelector(s);
const qsa = (s, el = document) => [...el.querySelectorAll(s)];
const pad = n => n.toString().padStart(2, "0");

function formatDateISO(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

function buildMonthOptions() {
  const sel = qs('#monthSelect');
  sel.innerHTML = monthNames.map((m, i) =>
    `<option value="${i}">${m}</option>`).join('');
}
function buildYearOptions(yearRange=5){
  const sel = qs('#yearSelect');
  const current = new Date().getFullYear();
  const years = [];
  for(let y=current-1; y<=current+yearRange; y++) years.push(y);
  sel.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join('');
}

function buildDays(year, month){
  const container = qs('#daysContainer');
  container.innerHTML = '';
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0).getDate();

  for(let day=1; day<=last; day++){
    const dateObj = new Date(year, month, day);
    const dow = weekDayNames[dateObj.getDay()];
    const div = document.createElement('div');
    div.className = 'day';
    div.dataset.date = formatDateISO(year, month, day);
    div.innerHTML = `
      <div class="dow">${dow}</div>
      <div class="date">${day}</div>
    `;
    container.appendChild(div);
  }
}

function setSelectedDate(dateStr){
  qsa('.day.selected').forEach(d=>d.classList.remove('selected'));
  const dayEl = qs(`.day[data-date="${dateStr}"]`);
  if(dayEl) dayEl.classList.add('selected');
  qs('#selectedDateLabel').textContent = dateStr;
  loadEvents(dateStr);
}

function loadEvents(dateStr){
  const container = qs('#eventsContainer');
  container.innerHTML = '';
  const list = eventsMap[dateStr] || [];
  if(!list.length){
    container.innerHTML = `<div class="no-events">No hay eventos programados.</div>`;
    return;
  }
  list.forEach(ev=>{
    // Session badge
    let badge = "";
    if (ev.type && sessionTypeMap[ev.type]) {
      const { badgeClass, icon } = sessionTypeMap[ev.type];
      badge = `<span class="event-badge ${badgeClass}">${icon} ${ev.type}</span>`;
    }
    const roster = getRoster(dateStr, ev.time);
    const spotsLeft = ev.capacity - roster.length;
    const capacity = `<div class="capacity">Capacidad: ${roster.length}/${ev.capacity} (${spotsLeft > 0 ? spotsLeft + ' libres' : 'completo'})</div>`;
    // Check if user is signed up (by email in localStorage, for demo just show sign up always)
    const div = document.createElement('div');
    div.className = 'event';
    div.innerHTML = `
      <span class="time">${ev.time}</span>
      ${badge}
      <div class="title">${ev.title}</div>
      <div class="desc">${ev.desc || ""}</div>
      ${capacity}
      <div style="margin-top:0.5em;display:flex;gap:0.7em;">
        <button class="btn" style="background:var(--blue);color:#fff;font-size:0.97em;padding:0.3em 1em;" ${spotsLeft<=0?'disabled':''}>Reservar</button>
        <button class="btn cancel" style="font-size:0.97em;padding:0.3em 1em;">Ver participantes</button>
      </div>
    `;
    // Sign up button
    div.querySelector('.btn:not(.cancel)').onclick = () => {
      openSignupModal(dateStr, ev);
    };
    // Roster button
    div.querySelector('.btn.cancel').onclick = () => {
      openRosterSidebar(dateStr, ev);
    };
    container.appendChild(div);
  });
}

/*────────────────  ROSTER SIDEBAR  ────────────────*/
let currentRosterSession = null;
function openRosterSidebar(dateStr, ev) {
  currentRosterSession = { dateStr, time: ev.time };
  qs('#rosterTitle').textContent = `Participantes – ${ev.title} (${ev.time})`;
  renderRosterList(dateStr, ev.time);
  qs('#rosterSidebar').classList.add('open');
}
function closeRosterSidebar() {
  qs('#rosterSidebar').classList.remove('open');
  currentRosterSession = null;
}
function renderRosterList(dateStr, time) {
  const list = getRoster(dateStr, time);
  const container = qs('#rosterList');
  if (!list.length) {
    container.innerHTML = `<div style="color:var(--text-muted);font-size:0.97em;">No hay participantes aún.</div>`;
    return;
  }
  container.innerHTML = '';
  list.forEach((runner, idx) => {
    const div = document.createElement('div');
    div.className = 'roster-item';
    div.innerHTML = `
      <div><b>${runner.name}</b></div>
      <div style="font-size:0.93em;color:var(--text-muted);">${runner.email}</div>
      <div style="font-size:0.93em;color:var(--text-muted);">Emergencia: ${runner.emergency}</div>
      <button class="cancel-btn" data-idx="${idx}">Cancelar</button>
    `;
    div.querySelector('.cancel-btn').onclick = () => {
      cancelSignup(dateStr, time, runner.email);
    };
    container.appendChild(div);
  });
}

/*────────────────  SIGNUP MODAL  ────────────────*/
let signupSession = null;
function openSignupModal(dateStr, ev) {
  signupSession = { dateStr, ev };
  qs('#signupModalBg').style.display = '';
  qs('#signupName').value = '';
  qs('#signupEmail').value = '';
  qs('#signupEmergency').value = '';
  qs('#signupError').style.display = 'none';
}
function closeSignupModal() {
  qs('#signupModalBg').style.display = 'none';
  signupSession = null;
}
function showSignupError(msg) {
  const err = qs('#signupError');
  err.textContent = msg;
  err.style.display = '';
}

/*────────────────  VALIDATION HELPERS  ────────────────*/
function validateEmail(email) {
  return /^[^@]+@[^@]+\.[^@]+$/.test(email);
}
function validatePhone(phone) {
  // Accepts numbers, spaces, dashes, parentheses, min 7 digits
  return /^[\d\s\-()+]{7,}$/.test(phone);
}

/*────────────────  SIGNUP LOGIC  ────────────────*/
function signupForSession(name, email, emergency) {
  const { dateStr, ev } = signupSession;
  let roster = getRoster(dateStr, ev.time);
  if (roster.length >= ev.capacity) {
    showSignupError('No quedan plazas disponibles.');
    return;
  }
  if (roster.some(r => r.email.toLowerCase() === email.toLowerCase())) {
    showSignupError('Ya estás inscrito en esta sesión.');
    return;
  }
  roster.push({ name, email, emergency });
  setRoster(dateStr, ev.time, roster);
  closeSignupModal();
  renderRosterList(dateStr, ev.time);
  // Update event list UI
  if (qs('.day.selected')?.dataset.date === dateStr) loadEvents(dateStr);
}

/*────────────────  CANCEL LOGIC  ────────────────*/
function cancelSignup(dateStr, time, email) {
  let roster = getRoster(dateStr, time);
  roster = roster.filter(r => r.email.toLowerCase() !== email.toLowerCase());
  setRoster(dateStr, time, roster);
  if (currentRosterSession && currentRosterSession.dateStr === dateStr && currentRosterSession.time === time) {
    renderRosterList(dateStr, time);
  }
  // Update event list UI
  if (qs('.day.selected')?.dataset.date === dateStr) loadEvents(dateStr);
}

/*────────────────  INIT & EVENTS  ────────────────*/
(function init(){
  buildMonthOptions();
  buildYearOptions();

  const today = new Date("2025-06-10"); // Demo starting date
  const monthSel = qs('#monthSelect');
  const yearSel  = qs('#yearSelect');
  monthSel.value = today.getMonth();
  yearSel.value  = today.getFullYear();

  function refreshDays(){ buildDays(+yearSel.value, +monthSel.value); }
  refreshDays();

  // select starting date after first render
  requestAnimationFrame(()=>setSelectedDate(formatDateISO(today.getFullYear(), today.getMonth(), today.getDate())));

  // Change month / year
  monthSel.addEventListener('change', ()=>{ refreshDays(); scrollToStart(); });
  yearSel.addEventListener('change',  ()=>{ refreshDays(); scrollToStart(); });

  // Prev / Next buttons
  qs('#prevMonth').addEventListener('click', ()=>{ changeMonth(-1); });
  qs('#nextMonth').addEventListener('click', ()=>{ changeMonth(1); });

  function changeMonth(offset){
    let m = +monthSel.value + offset;
    let y = +yearSel.value;
    if(m < 0){ m = 11; y--; }
    if(m > 11){ m = 0; y++; }
    monthSel.value = m;
    yearSel.value = y;
    monthSel.dispatchEvent(new Event('change'));
  }

  // Click day
  qs('#daysContainer').addEventListener('click', e=>{
    const day = e.target.closest('.day');
    if(day) setSelectedDate(day.dataset.date);
  });

  // optional: open native picker
  qs('#openPicker').addEventListener('click', ()=>{
    const curr = qs('#selectedDateLabel').textContent;
    const input = document.createElement('input');
    input.type = 'date';
    input.value = curr;
    input.style.opacity = 0;
    document.body.appendChild(input);
    input.addEventListener('change', ()=>{
      const d = new Date(input.value);
      monthSel.value = d.getMonth();
      yearSel.value = d.getFullYear();
      monthSel.dispatchEvent(new Event('change'));
      setSelectedDate(formatDateISO(d.getFullYear(), d.getMonth(), d.getDate()));
      document.body.removeChild(input);
    });
    input.click();
  });

  function scrollToStart(){
    // Small helper to reset scroll on month change
    qs('#daysContainer').scrollTo({left:0, behavior:'smooth'});
  }

  // Sidebar close
  qs('#closeRoster').onclick = closeRosterSidebar;

  // Modal cancel
  qs('#cancelSignup').onclick = closeSignupModal;

  // Modal submit
  qs('#signupForm').onsubmit = function(e) {
    e.preventDefault();
    const name = qs('#signupName').value.trim();
    const email = qs('#signupEmail').value.trim();
    const emergency = qs('#signupEmergency').value.trim();
    if (!name || !email || !emergency) {
      showSignupError('Por favor, completa todos los campos.');
      return;
    }
    if (!validateEmail(email)) {
      showSignupError('Introduce un email válido.');
      return;
    }
    if (!validatePhone(emergency)) {
      showSignupError('Introduce un número de contacto válido.');
      return;
    }
    signupForSession(name, email, emergency);
  };

  // Close modal on background click
  qs('#signupModalBg').onclick = function(e) {
    if (e.target === this) closeSignupModal();
  };
})();

/*────────────────  OVERRIDE loadEvents  ────────────────*/
function loadEvents(dateStr){
  const container = qs('#eventsContainer');
  container.innerHTML = '';
  const list = eventsMap[dateStr] || [];
  if(!list.length){
    container.innerHTML = `<div class="no-events">No hay eventos programados.</div>`;
    return;
  }
  list.forEach(ev=>{
    // Session badge
    let badge = "";
    if (ev.type && sessionTypeMap[ev.type]) {
      const { badgeClass, icon } = sessionTypeMap[ev.type];
      badge = `<span class="event-badge ${badgeClass}">${icon} ${ev.type}</span>`;
    }
    const roster = getRoster(dateStr, ev.time);
    const spotsLeft = ev.capacity - roster.length;
    const capacity = `<div class="capacity">Capacidad: ${roster.length}/${ev.capacity} (${spotsLeft > 0 ? spotsLeft + ' libres' : 'completo'})</div>`;
    const div = document.createElement('div');
    div.className = 'event';
    div.innerHTML = `
      <span class="time">${ev.time}</span>
      ${badge}
      <div class="title">${ev.title}</div>
      <div class="desc">${ev.desc || ""}</div>
      ${capacity}
      <div style="margin-top:0.5em;display:flex;gap:0.7em;">
        <button class="btn" style="background:var(--blue);color:#fff;font-size:0.97em;padding:0.3em 1em;" ${spotsLeft<=0?'disabled':''}>Reservar</button>
        <button class="btn cancel" style="font-size:0.97em;padding:0.3em 1em;">Ver participantes</button>
      </div>
    `;
    // Sign up button
    div.querySelector('.btn:not(.cancel)').onclick = () => {
      openSignupModal(dateStr, ev);
    };
    // Roster button
    div.querySelector('.btn.cancel').onclick = () => {
      openRosterSidebar(dateStr, ev);
    };
    container.appendChild(div);
  });
}
</script>
